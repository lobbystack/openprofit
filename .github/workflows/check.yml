name: Check

# Pushes to main run this through docker.yml, which deploys only when it passes.
on:
  pull_request:
  workflow_call:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bunx --bun tsc --noEmit
      - run: bun run build
      - run: cd packages/cli && bun run build && bun run test
